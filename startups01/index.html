<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="description" content="10 startups with their names hidden. Guess how much each raised and whether it lived or died, then see if you beat Reid.">
<title>Did It Live or Die?</title>
<title>Lived or Died</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { color-scheme:dark; --night:#0b0d17; --ink:#f4f1ea; --dim:#8a8fa8; --neon:#ffd23f; --live:#2fe07a; --dead:#ff4a3a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#000; overflow:hidden; }
  body { font-family:"Archivo","Helvetica Neue",Arial,sans-serif; color:var(--ink); }
  .px { font-family:"Press Start 2P",monospace; letter-spacing:.04em; }
  .an { font-family:"Anton",Impact,sans-serif; text-transform:uppercase; line-height:.9; }

  #stage { position:fixed; left:50%; top:50%; width:1920px; height:1080px; overflow:hidden; transform-origin:center;
    background:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0/64px 64px,
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0/64px 64px,
      radial-gradient(1300px 760px at 50% 45%, #1c2244, #0b0d17 70%); }
  #stage::after { content:""; position:absolute; inset:0; pointer-events:none; z-index:20;
    background:repeating-linear-gradient(transparent 0 3px, rgba(0,0,0,.04) 3px 4px); }

  /* ---------- HUD ---------- */
  .hud { position:absolute; left:0; right:0; top:0; height:96px; z-index:10; display:flex; align-items:center; justify-content:space-between;
    padding:0 44px; background:linear-gradient(#090b14, rgba(9,11,20,.85)); border-bottom:2px solid rgba(255,255,255,.08); }
  .hud .iq { display:flex; align-items:center; gap:18px; min-width:420px; }
  .hud .iq .k { font-size:15px; color:var(--neon); }
  .hud .iq .v { font-family:"Anton",Impact,sans-serif; font-size:62px; line-height:1; color:#fff; min-width:90px; }
  .hud .iq .v.bump { animation:bump .5s ease-out; }
  .hud .iq .of { font-size:13px; color:var(--dim); }
  .hud .mid { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .hud .lvl { font-size:13px; color:#fff; }
  .hud .pips { display:flex; gap:8px; }
  .hud .pip { width:40px; height:12px; border-radius:6px; background:rgba(255,255,255,.13); }
  .hud .pip.ok { background:var(--live); } .hud .pip.no { background:var(--dead); }
  .hud .pip.cur { background:var(--neon); box-shadow:0 0 16px var(--neon); }
  .hud .right { display:flex; gap:14px; min-width:420px; justify-content:flex-end; }
  .chipx { font-size:13px; padding:12px 16px; border-radius:10px; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.12); }
  .chipx.fire { background:#ff5a1f; border-color:#ffb38f; color:#fff; box-shadow:0 0 20px rgba(255,90,31,.6); }
  .chipx.rank { color:var(--neon); }
  @keyframes bump { 0% { transform:scale(1); color:#fff; } 30% { transform:scale(1.35); color:var(--neon); } 100% { transform:scale(1); color:#fff; } }

  /* ---------- screens ---------- */
  .scr { position:absolute; left:0; right:0; top:96px; bottom:0; display:none; perspective:2200px; }
  .scr.on { display:block; }
  .scr.full { top:0; z-index:15; }
  .panel { position:absolute; left:56px; right:56px; top:30px; bottom:46px; border-radius:40px; background:#121633; overflow:hidden;
    box-shadow:0 18px 0 rgba(0,0,0,.45), inset 0 0 0 4px rgba(255,255,255,.1); }
  .scr.on .panel { animation:cardIn .5s cubic-bezier(.2,1.35,.4,1); }
  .panel .kick { position:absolute; left:64px; top:52px; font-size:16px; color:var(--neon); }
  .panel h2 { position:absolute; left:64px; top:96px; font-size:120px; color:#fff; }
  @keyframes cardIn { from { transform:translateY(60px) scale(.94); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes slam { from { transform:scale(1.8) rotate(-4deg); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes blink { 50% { opacity:0; } }
  @keyframes float { 50% { translate:0 -14px; } }
  @keyframes pulse { 50% { transform:scale(1.12); } }

  /* title */
  .title { background:radial-gradient(1200px 700px at 30% 40%, #3a1622, #0b0d17 70%); }
  .title .k { position:absolute; left:110px; top:120px; font-size:22px; color:var(--neon); }
  .title h1 { position:absolute; left:100px; top:180px; font-size:230px; color:#fff; text-shadow:0 14px 0 rgba(0,0,0,.4); }
  .title h1 .l { color:var(--live); } .title h1 .d { color:var(--dead); }
  .title .sub { position:absolute; left:110px; top:690px; font-size:44px; font-weight:900; color:#fff; }
  .title .press { position:absolute; left:110px; bottom:110px; font-size:22px; color:#fff; animation:blink 1.1s steps(2) infinite; }
  .title .stones { position:absolute; right:110px; top:190px; display:flex; gap:30px; align-items:flex-end; }
  .stone { width:230px; height:300px; border-radius:115px 115px 14px 14px; background:#3a3f55; box-shadow:inset 0 -14px 0 rgba(0,0,0,.3), 0 24px 40px rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:#c9cde0; animation:float 4s ease-in-out infinite; }
  .stone b { font-family:"Anton",Impact,sans-serif; font-size:76px; } .stone span { font-size:14px; }
  .trophy { width:230px; height:360px; border-radius:24px; background:var(--live); color:#0b2a17; box-shadow:inset 0 -14px 0 rgba(0,0,0,.2), 0 24px 40px rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; animation:float 4s 1s ease-in-out infinite; }
  .trophy b { font-family:"Anton",Impact,sans-serif; font-size:64px; text-align:center; line-height:.95; } .trophy span { font-size:14px; }

  /* rules */
  .rules { position:absolute; left:64px; right:64px; top:270px; display:grid; grid-template-columns:repeat(3,1fr); gap:28px; }
  .rule { border-radius:28px; background:#1c2148; padding:36px; height:380px; display:flex; flex-direction:column; justify-content:space-between; opacity:0; transform:translateY(30px); }
  .scr.on .rule { animation:up .5s ease-out forwards; }
  .scr.on .rule:nth-child(2) { animation-delay:.25s; } .scr.on .rule:nth-child(3) { animation-delay:.5s; }
  @keyframes up { to { opacity:1; transform:none; } }
  .rule .n { font-size:16px; color:var(--neon); }
  .rule .t { font-family:"Anton",Impact,sans-serif; font-size:84px; text-transform:uppercase; color:#fff; line-height:.95; }
  .rule .p { font-family:"Anton",Impact,sans-serif; font-size:120px; color:var(--neon); line-height:1; }
  .rule .e { font-size:26px; font-weight:700; color:var(--dim); line-height:1.3; }
  .rules-foot { position:absolute; left:64px; right:64px; bottom:60px; font-family:"Anton",Impact,sans-serif; font-size:60px; text-transform:uppercase; color:#fff; }
  .rules-foot em { font-style:normal; color:var(--neon); }

  /* round splash */
  .splash { overflow:hidden; }
  .splash .stripes { position:absolute; inset:-200px; background:repeating-linear-gradient(-45deg, var(--lc) 0 46px, var(--lc2) 46px 92px); animation:slide 3s linear infinite; }
  @keyframes slide { to { transform:translate(130px,0); } }
  .splash .inner { position:absolute; left:120px; right:120px; top:110px; }
  .splash .lv { font-size:26px; color:#111; background:#fff; display:inline-block; padding:14px 18px; border-radius:10px; box-shadow:0 8px 0 rgba(0,0,0,.35); }
  .splash-t { font-size:280px; color:#fff; margin-top:34px; text-shadow:0 12px 0 rgba(0,0,0,.35); }
  .scr.on .splash-t { animation:slam .55s cubic-bezier(.2,1.5,.4,1); }
  .splash .sub { font-size:46px; font-weight:900; color:#fff; margin-top:26px; text-shadow:0 4px 0 rgba(0,0,0,.3); }
  .map { position:absolute; left:120px; right:120px; bottom:60px; height:150px; }
  .map .line { position:absolute; left:40px; right:40px; top:38px; height:10px; border-radius:5px; background:rgba(0,0,0,.35); }
  .map .nodes { position:absolute; inset:0; display:flex; justify-content:space-between; }
  .map .n { width:86px; display:flex; flex-direction:column; align-items:center; gap:14px; position:relative; }
  .map .n b { width:86px; height:86px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:"Press Start 2P"; font-size:18px;
    background:#1b1f35; color:#777; border:6px solid rgba(0,0,0,.35); }
  .map .n.ok b { background:var(--live); color:#0b2a17; } .map .n.no b { background:var(--dead); color:#2a0b0b; }
  .map .n.cur b { background:#fff; color:#111; box-shadow:0 0 0 8px var(--neon), 0 0 40px #fff; animation:pulse 1.2s ease-in-out infinite; }
  .map .n.boss b { border-color:var(--neon); }
  .map .n span { font-size:11px; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.5); white-space:nowrap; }

  /* clue screen: a case file */
  .file { position:absolute; left:56px; right:56px; top:30px; bottom:46px; border-radius:40px; background:#efe6d2; color:#1a1712; overflow:hidden;
    box-shadow:0 18px 0 rgba(0,0,0,.45), inset 0 0 0 4px rgba(0,0,0,.08); }
  .scr.on.c1 .file { animation:cardIn .5s cubic-bezier(.2,1.35,.4,1); }
  .file .tab { position:absolute; left:64px; top:46px; display:flex; gap:14px; align-items:center; }
  .file .tab span { font-size:14px; padding:10px 14px; border-radius:8px; background:#1a1712; color:#efe6d2; }
  .file .tab span.ol { background:transparent; color:#1a1712; border:2px solid #1a1712; }
  .file .tab span.x2 { background:var(--neon); color:#111; }
  .file .codename { position:absolute; left:60px; top:104px; font-size:120px; color:#1a1712; }
  .file .codename em { font-style:normal; color:#b8ad95; }
  .clues { position:absolute; left:64px; top:250px; width:1130px; display:flex; flex-direction:column; gap:22px; }
  .clue { border-radius:22px; padding:26px 32px; background:#fff; box-shadow:0 6px 0 rgba(0,0,0,.12); }
  .clue .h { display:flex; gap:16px; align-items:center; font-size:13px; color:#8a826f; margin-bottom:14px; }
  .clue .h i { font-style:normal; background:#1a1712; color:#fff; padding:6px 10px; border-radius:6px; }
  .clue .b { font-size:34px; font-weight:700; line-height:1.24; }
  .clue.old { background:rgba(255,255,255,.5); box-shadow:none; }
  .clue.old .b { font-size:25px; color:#5a5446; }
  .clue.new { box-shadow:0 0 0 6px var(--neon), 0 10px 0 rgba(0,0,0,.15); }
  .scr.on .clue.new { animation:clueIn .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes clueIn { from { transform:translateX(-40px) scale(.96); opacity:0; } to { transform:none; opacity:1; } }
  .picks { position:absolute; right:64px; top:250px; width:540px; display:flex; flex-direction:column; gap:24px; }
  .pk { height:200px; border-radius:30px; display:flex; align-items:center; justify-content:space-between; padding:0 40px; position:relative;
    font-family:"Anton",Impact,sans-serif; font-size:110px; text-transform:uppercase; box-shadow:0 12px 0 rgba(0,0,0,.3); transition:all .25s; cursor:pointer; }
  .pk .key { font-family:"Press Start 2P"; font-size:22px; width:60px; height:60px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.25); color:#fff; }
  .pk.live { background:var(--live); color:#0b2a17; } .pk.dead { background:var(--dead); color:#2a0b0b; }
  .pk.pick { transform:scale(1.05); box-shadow:0 0 0 10px #1a1712, 0 0 0 18px var(--neon), 0 16px 0 rgba(0,0,0,.3); }
  .pk.off { opacity:.18; filter:grayscale(1); }
  .worth { text-align:center; font-size:15px; color:#5a5446; margin-top:6px; line-height:1.8; }
  .worth b { font-family:"Anton",Impact,sans-serif; font-size:64px; color:#1a1712; display:block; letter-spacing:0; }
  .lockbadge { display:none; text-align:center; font-size:15px; padding:18px; border-radius:16px; background:#1a1712; color:var(--neon); line-height:1.7; }
  .locked .lockbadge { display:block; } .locked .worth { display:none; }
  .nudge { animation:nudge .4s; }
  @keyframes nudge { 20%,60% { transform:translateX(-12px); } 40%,80% { transform:translateX(12px); } }

  /* reveal */
  .rv { position:absolute; left:56px; right:56px; top:30px; bottom:46px; border-radius:40px; background:var(--b); color:var(--f); overflow:hidden;
    box-shadow:0 18px 0 rgba(0,0,0,.45), inset 0 0 0 4px rgba(255,255,255,.16); }
  .scr.on .rv { animation:flip .6s cubic-bezier(.2,1.2,.4,1); }
  @keyframes flip { from { transform:rotateY(-80deg) scale(.95); opacity:.2; } to { transform:none; opacity:1; } }
  .rv .tag { position:absolute; left:64px; top:52px; display:flex; gap:14px; }
  .rv .tag span { font-size:14px; padding:10px 14px; border-radius:8px; background:var(--f); color:var(--b); }
  .rv .tag span.ol { background:transparent; color:var(--f); border:2px solid var(--f); }
  .rv .was { position:absolute; left:64px; top:126px; font-size:18px; opacity:.8; }
  .rv .name { position:absolute; left:56px; top:170px; font-size:220px; white-space:nowrap; }
  .rv .name.l { font-size:170px; }
  .scr.on .rv .name { animation:slam .55s .25s cubic-bezier(.2,1.5,.4,1) backwards; }
  .rv .yrs { position:absolute; left:64px; top:400px; font-size:22px; opacity:.85; }
  .rv .stat { position:absolute; left:64px; top:470px; width:1120px; font-family:"Anton",Impact,sans-serif; font-size:110px; text-transform:uppercase; line-height:.95; }
  .rv .stat small { display:block; font-family:"Press Start 2P"; font-size:15px; margin-bottom:16px; opacity:.8; letter-spacing:.04em; }
  .rv .story { position:absolute; left:64px; top:700px; width:1120px; font-size:36px; font-weight:700; line-height:1.28; opacity:0; transform:translateY(16px); transition:all .45s ease-out; }
  .rv .story.show { opacity:1; transform:none; }
  .rv .src { position:absolute; left:64px; bottom:36px; font-size:12px; opacity:.6; }
  .fate { position:absolute; right:110px; top:120px; width:520px; height:520px; display:flex; align-items:center; justify-content:center; opacity:0; z-index:2; }
  .fate.show { opacity:1; animation:fate .4s cubic-bezier(.2,1.6,.4,1); }
  @keyframes fate { from { transform:scale(2.2) rotate(-10deg); opacity:0; } to { transform:none; opacity:1; } }
  .fate .stone { width:400px; height:500px; border-radius:200px 200px 20px 20px; animation:none; background:#454a60; color:#e8eaf3; border:8px solid #2b2f40; }
  .fate .stone b { font-size:150px; } .fate .stone span { font-size:20px; }
  .fate .trophy { width:440px; height:440px; border-radius:50%; animation:none; border:10px solid #0b2a17; transform:rotate(-8deg); }
  .fate .trophy b { font-size:110px; } .fate .trophy span { font-size:18px; }
  .you { position:absolute; right:110px; top:690px; width:520px; display:flex; font-weight:900; font-size:30px; text-transform:uppercase; opacity:0; z-index:3; }
  .you.show { opacity:1; animation:fate .35s cubic-bezier(.2,1.6,.4,1); }
  .you span { padding:16px 22px; } .you .me { background:var(--f); color:var(--b); border-radius:14px 0 0 14px; flex:1; } .you .vd { color:#111; border-radius:0 14px 14px 0; }
  .plus { position:absolute; right:180px; top:560px; font-family:"Anton",Impact,sans-serif; font-size:150px; color:var(--neon); opacity:0; z-index:4; text-shadow:0 8px 0 rgba(0,0,0,.35); }
  .plus.show { animation:plus 1.4s ease-out forwards; }
  @keyframes plus { 0% { opacity:0; transform:translateY(40px) scale(.6); } 20% { opacity:1; transform:none; } 75% { opacity:1; } 100% { opacity:0; transform:translateY(-120px); } }
  .shake { animation:shake .4s !important; }
  @keyframes shake { 20%,60% { transform:translateX(-14px); } 40%,80% { transform:translateX(14px); } }
  .confetti { position:absolute; inset:0; pointer-events:none; z-index:5; overflow:hidden; }
  .confetti i { position:absolute; top:-30px; width:16px; height:26px; border-radius:3px; animation:fall var(--t) cubic-bezier(.3,.6,.5,1) forwards; }
  @keyframes fall { to { transform:translate(var(--dx), 1100px) rotate(var(--r)); opacity:.9; } }

  /* scoreboard */
  .rows { position:absolute; left:64px; top:250px; width:1150px; }
  .r { display:grid; grid-template-columns:330px 1fr 1fr 1fr 110px; align-items:center; gap:16px; height:104px; border-bottom:2px solid rgba(255,255,255,.12); font-size:32px; font-weight:900; color:#fff; }
  .r.hd { height:50px; font-size:12px; color:var(--dim); font-family:"Press Start 2P"; }
  .r .g { color:var(--dim); }
  .r .pp { text-align:right; font-family:"Anton",Impact,sans-serif; font-size:50px; }
  .r .pp.p0 { color:var(--dead); } .r .pp.p1 { color:#ffb020; } .r .pp.p2 { color:#9be86b; } .r .pp.p3 { color:var(--live); }
  .chip { display:inline-flex; font-family:"Anton",Impact,sans-serif; font-size:38px; text-transform:uppercase; padding:6px 16px; border-radius:10px; justify-self:start; white-space:nowrap; }
  .fl { font-family:"Anton",Impact,sans-serif; font-size:40px; text-transform:uppercase; } .fl.L { color:var(--live); } .fl.D { color:var(--dead); }
  .tot { position:absolute; right:64px; top:250px; width:480px; border-radius:28px; background:var(--neon); color:#111; padding:34px 36px; box-shadow:0 12px 0 rgba(0,0,0,.4); }
  .tot .k { font-size:14px; }
  .tot .v { font-family:"Anton",Impact,sans-serif; font-size:150px; line-height:1; margin-top:14px; }
  .tot .v small { font-size:60px; opacity:.6; }
  .tot .d { font-weight:900; font-size:26px; margin-top:18px; padding-top:18px; border-top:3px solid rgba(0,0,0,.2); text-transform:uppercase; line-height:1.35; }

  /* graveyard vs survivors */
  .yard { position:absolute; left:64px; right:64px; top:250px; display:grid; grid-template-columns:1fr 1fr; gap:40px; }
  .yard h3 { font-size:18px; margin-bottom:22px; } .yard .dh { color:var(--dead); } .yard .lh { color:var(--live); }
  .yard .row { display:flex; gap:16px; flex-wrap:wrap; }
  .tile { width:146px; height:200px; border-radius:75px 75px 12px 12px; background:#3a3f55; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding-bottom:22px; gap:10px; position:relative; opacity:0; transform:translateY(30px); }
  .tile.w { border-radius:20px; background:#1d4a32; }
  .scr.on .tile { animation:up .45s ease-out forwards; }
  .tile b { font-family:"Anton",Impact,sans-serif; font-size:30px; text-transform:uppercase; color:#fff; text-align:center; line-height:.95; padding:0 8px; }
  .tile span { font-size:10px; color:#c9cde0; }
  .tile .mk { position:absolute; top:-16px; right:-12px; width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:"Anton",Impact,sans-serif; font-size:30px; color:#111; border:4px solid #121633; }
  .yard-foot { position:absolute; left:64px; right:64px; bottom:60px; font-family:"Anton",Impact,sans-serif; font-size:56px; text-transform:uppercase; color:#fff; }
  .yard-foot em { font-style:normal; color:var(--neon); }

  /* final */
  .ladder { position:absolute; right:64px; top:110px; width:520px; display:flex; flex-direction:column-reverse; gap:14px; }
  .ladder div { font-size:18px; padding:22px 24px; border-radius:16px; background:rgba(255,255,255,.06); color:var(--dim); display:flex; justify-content:space-between; }
  .ladder div.me { background:var(--neon); color:#111; transform:scale(1.06); box-shadow:0 0 40px rgba(255,210,63,.6); }
  .fin-k { position:absolute; left:64px; top:110px; font-size:18px; color:var(--neon); }
  .fin-v { position:absolute; left:52px; top:150px; font-size:300px; color:#fff; }
  .fin-v small { font-size:110px; color:var(--dim); }
  .fin-r { position:absolute; left:64px; top:500px; font-size:44px; font-weight:900; color:var(--dim); text-transform:uppercase; }
  .fin-rank { position:absolute; left:52px; top:560px; font-size:180px; color:var(--neon); text-shadow:0 0 50px rgba(255,210,63,.5); white-space:nowrap; }
  .scr.on .fin-rank { animation:slam .6s .3s cubic-bezier(.2,1.5,.4,1) backwards; }
  .fin-c { position:absolute; left:64px; bottom:60px; font-size:16px; color:#fff; animation:blink 1.1s steps(2) infinite; }

  /* cheat sheet: a screen before round 1, and an overlay (H) during clues */
  .cheat { position:absolute; left:64px; right:64px; top:250px; display:grid; grid-template-columns:1fr 1fr; gap:28px; }
  .cheat .col { border-radius:28px; padding:30px 34px; display:flex; flex-direction:column; gap:20px; }
  .cheat .col.red { background:#2a1520; box-shadow:inset 0 0 0 4px rgba(255,74,58,.5); }
  .cheat .col.grn { background:#122a20; box-shadow:inset 0 0 0 4px rgba(47,224,122,.5); }

stage.insertAdjacentHTML("beforeend", `<div class="hud">
  <div class="iq"><span class="k px">SCORE</span><span class="v" id="iq">0</span><span class="of px">/ ${MAXPTS}</span></div>
  <div class="mid"><div class="lvl px" id="lvl"></div><div class="pips">${ROUNDS.map(()=>`<i class="pip"></i>`).join("")}</div></div>
  <div class="right"><span class="chipx px" id="streak">STREAK 0</span><span class="chipx px rank" id="rank">INTERN</span></div></div>`);
const screens = [], revealAt = {}, endAt = {};
function add(cls, html, opts={}) { const d=document.createElement("section"); d.className="scr "+cls; d.innerHTML=html; stage.appendChild(d); screens.push({el:d, ...opts}); return d; }

add("full title", `
  <div class="k px">10 startups · 2 questions each · 20 points</div>
  <h1 class="an">Did it <span class="l">live</span><br>or <span class="d">die?</span></h1>
  <div class="sub">How much did it raise? Did it survive?</div>
  <div class="press px">▶ PRESS START</div>`, { kind:"title" });

add("", `<div class="panel"><div class="kick px">Read this first · 1 of 2</div><h2 class="an">Who raises big?</h2>
  <div class="defn"><b>Raised</b> means investors paid for a piece of the company. It isn't sales, and it isn't profit.</div>
  <div class="cheat low">
    <div class="col ylw"><h3 class="px">Usually raises $50M+</h3>
      <div class="tip"><i>1</i><div><b>Costly to build</b><span>Gadgets, robots and factories burn cash before the first sale.</span></div></div>
      <div class="tip"><i>2</i><div><b>Star founders</b><span>Investors chase people who worked at Apple or Google.</span></div></div>
      <div class="tip"><i>3</i><div><b>A race to get huge</b><span>Apps that have to grab everyone before a rival does.</span></div></div>
    </div>
    <div class="col blu"><h3 class="px">Usually doesn't</h3>
      <div class="tip"><i>1</i><div><b>Cheap to start</b><span>A small product or simple software a few people can make.</span></div></div>
      <div class="tip"><i>2</i><div><b>Paid from day one</b><span>Customers fund it, so it never has to ask.</span></div></div>
      <div class="tip"><i>3</i><div><b>Old or unsexy</b><span>Boring ideas get less attention from investors.</span></div></div>
    </div>
  </div></div>`, { kind:"read" });

// Patterns that predict a startup's fate. True in general, not an answer key: some rounds break them.
const CHEAT = `<div class="kick px">Read this first · 2 of 2</div><h2 class="an">Who survives?</h2>
  <div class="cheat">
    <div class="col red"><h3 class="px">Usually dies</h3>
      <div class="tip"><i>1</i><div><b>Every sale costs too much</b><span>Hardware, drivers and robots eat the money before the company makes any.</span></div></div>
      <div class="tip"><i>2</i><div><b>Money before customers</b><span>A huge check before people really want it just hides the problem.</span></div></div>
      <div class="tip"><i>3</i><div><b>Story bigger than the proof</b><span>Big promises and big user numbers, but no proof of real customers paying.</span></div></div>
    </div>
    <div class="col grn"><h3 class="px">Usually lives</h3>
      <div class="tip"><i>1</i><div><b>Customers paid early</b><span>Real sales came in before big investors showed up.</span></div></div>
      <div class="tip"><i>2</i><div><b>Cheap + easy to explain</b><span>Simple to make, easy to get in one sentence, and people buy it again.</span></div></div>
      <div class="tip"><i>3</i><div><b>Followed what users loved</b><span>They solved their own problem or moved toward what was already working.</span></div></div>
    </div>
  </div>
  <div class="cheat-foot">Some of these startups <em>break the rules.</em> That's the game.</div>`;
add("", `<div class="panel">${CHEAT}</div>`, { kind:"read" });

const tagRow = (ri, q) => `<div class="tag"><span class="px">Startup ${ri+1} of 10</span><span class="px ol">Question ${q} of 2</span><span class="px ol hintkey" data-cheat>H · Hints</span></div>`;
const QVARS = "--b:#151a35;--f:#ffffff";
function moneyQ(R, ri) {
  add("", `<div class="rv qc" style="${QVARS}">${photo(R,"m1")}
    <div class="side">${tagRow(ri,1)}
      <div class="what">${R.what}</div>
      <div class="pays"><b>How it makes money:</b> ${R.pays}</div>
      <div class="q an">How much did it raise?</div>
      <div class="btns"><div class="pk big" data-p="1">$50M+<span class="key">A</span></div><div class="pk small" data-p="0">Under $50M<span class="key">D</span></div></div>
    </div></div>`, { kind:"money", R, ri });
}
function endQ(R, ri) {
  add("", `<div class="rv qc" style="${QVARS}">${photo(R,"m2")}
    <div class="side">${tagRow(ri,2)}
      <div class="res"></div>
      <div class="amt2 an">${R.raised}</div>
      <div class="pays">${R.money}</div>
      <div class="pays tw"><b>The twist:</b> ${R.twist}</div>
      <div class="q an">Did it survive?</div>
      <div class="btns"><div class="pk live" data-p="1">Lived<span class="key">A</span></div><div class="pk dead" data-p="0">Died<span class="key">D</span></div></div>
    </div></div>`, { kind:"end", R, ri });
}
function reveal(R, ri) {
  const dead = R.fate === "D";
  add("", `<div class="rv rvl" style="--b:${R.bg};--f:${R.fg}">
    <div class="rcol">
      <div class="tag"><span class="px">Startup ${ri+1} of 10</span><span class="px ol">${R.yrs}</span>${R.was ? `<span class="px ol">${R.was}</span>` : ""}</div>
      ${plate(R)}
      <div class="stats">
        <div class="st"><span class="px">Raised</span><b>${R.raised}</b></div>
        <div class="st"><span class="px">${R.mid[0]}</span><b>${R.mid[1]}</b></div>
        <div class="st now"><span class="px">Today</span><b>${R.today}</b></div>
      </div>
      <div class="roast an">${R.roast}</div>
      <div class="story">${R.story}</div>
      <div class="src px">Source: ${R.src}</div>
    </div>
    <div class="rpic">${photo(R)}
      <div class="verdict"><div class="fate"><div class="bigstamp an ${dead?"d":"l"}">${dead?"Dead":"Alive"}</div></div><div class="you"></div></div>
    </div></div>`, { kind:"reveal", R, ri });
}
function scoreboard(from, to, label) {
  add("", `<div class="panel"><div class="kick px">${label}</div><h2 class="an">${to===ROUNDS.length?"Part 2":"Part 1"} results</h2>
    <div class="rows"></div><div class="tot"></div></div>`, { kind:"sb", from, to, ri: to===ROUNDS.length ? undefined : to-1 });
}

ROUNDS.forEach((R, ri) => {
  moneyQ(R, ri);
  endQ(R, ri);
  reveal(R, ri);
  if (ri === HALF-1) scoreboard(0, HALF, "Halftime");
});
scoreboard(HALF, ROUNDS.length, "Game over");
screens.forEach((s,i) => { if (s.kind==="reveal") revealAt[s.R.id] = i; if (s.kind==="end") endAt[s.R.id] = i; });
add("", `<div class="panel"><div class="kick px">Where they are today</div><h2 class="an">Graveyard vs. survivors</h2>
  <div class="yard"><div><h3 class="px dh">The graveyard</h3><div class="row" id="yd"></div></div><div><h3 class="px lh">Still alive</h3><div class="row" id="yl"></div></div></div>
  <div class="yard-foot">Nearly $1B raised by the dead ones. <em>The biggest winner raised $0.</em></div></div>`, { kind:"yard" });
add("", `<div class="panel"><div class="fin-k px">Final score</div><div class="fin-v an"></div><div class="fin-r">Rank</div><div class="fin-rank an"></div>
  <div class="ladder"></div><div class="vs"></div><div class="fin-c px">▼ Comment your score</div></div>`, { kind:"final" });

// ---- HUD: a money point lands on the next slide, a survive point when the stamp hits
let cur = 0;
function hud(s, hold) {
  const ri = s.ri ?? (["title","read"].includes(s.kind) ? -1 : ROUNDS.length);
  let tot = 0, streak = 0;
  ROUNDS.forEach(R => {
    if (endAt[R.id] <= cur) { const m = moneyPt(R); if (m != null) { tot += m; streak = m ? streak+1 : 0; } }
    if (revealAt[R.id] > cur || (hold && revealAt[R.id] === cur)) return;
    const e = endPt(R); if (e != null) { tot += e; streak = e ? streak+1 : 0; } });
  const iq = document.getElementById("iq");
  if (iq.textContent !== String(tot)) { iq.textContent = tot; iq.classList.remove("bump"); void iq.offsetWidth; iq.classList.add("bump"); }
  const st = document.getElementById("streak");
  st.textContent = streak >= 2 ? `STREAK x${streak}` : `STREAK ${streak}`; st.classList.toggle("fire", streak >= 2);
  document.getElementById("rank").textContent = rankOf(tot).toUpperCase();
  document.getElementById("lvl").textContent = ri < 0 ? "READ FIRST" : ri >= ROUNDS.length ? "GAME OVER" : `STARTUP ${ri+1} OF 10 · ${ri < HALF ? "PART 1" : "PART 2"}`;
  document.querySelectorAll(".pip").forEach((p,i)=>{ const R = ROUNDS[i], done = revealAt[R.id] <= cur && !(hold && revealAt[R.id] === cur), sc = roundPts(R);
    p.classList.toggle("ok", done && sc > 0); p.classList.toggle("no", done && sc === 0); p.classList.toggle("cur", i === ri && !done); });
}

// ---- renderers
function renderQ(s) {
  const a = s.kind==="money" ? S.money[s.R.id] : (S.end[s.R.id] == null ? null : S.end[s.R.id]==="L"), set = a != null;
  s.el.querySelectorAll(".pk").forEach(p => { const mine = (p.dataset.p === "1") === a; p.classList.toggle("pick", set && mine); p.classList.toggle("off", set && !mine); });
  if (s.kind==="end") { const m = moneyPt(s.R), res = s.el.querySelector(".res");
    res.textContent = m == null ? "It raised" : m ? "Right! +1. It raised" : "Wrong. It raised";
    res.className = "res px " + (m == null ? "" : m ? "ok" : "no"); }
}
function answer(s, top) {
  if (s.kind==="money" && S.money[s.R.id] == null) { S.money[s.R.id] = top; log("money", { n:cur, round:s.R.id, big:top }); }
  else if (s.kind==="end" && S.end[s.R.id] == null) { S.end[s.R.id] = top ? "L" : "D"; log("end", { n:cur, round:s.R.id, pick:S.end[s.R.id] }); }
  else return;
  save(); renderQ(s);
  setTimeout(() => { if (screens[cur] === s) show(cur+1); }, 600);   // one press per decision
}
function renderReveal(s) {
  const R = s.R, pick = S.end[R.id], p = endPt(R), el = s.el, rv = el.querySelector(".rv");
  ["fate","you","roast","story"].forEach(c => el.querySelector("."+c).classList.remove("show"));
  rv.classList.remove("shake");
  (s.timers || []).forEach(clearTimeout);
  // beats: raised -> middle number -> TODAY -> the stamp + result -> the roast and story
  s.timers = [
    setTimeout(() => { el.querySelector(".fate").classList.add("show");
      if (pick) { const you = el.querySelector(".you");
        you.innerHTML = `<span class="me">${WHO} said ${FATE[pick]}</span><span class="vd" style="background:${p?"var(--live)":"var(--dead)"}">${p?"+1":"Wrong"}</span>`;
        you.classList.add("show");
        if (!p) { void rv.offsetWidth; rv.classList.add("shake"); } }
      hud(s); }, 2500),
    setTimeout(() => { el.querySelector(".roast").classList.add("show"); el.querySelector(".story").classList.add("show"); }, 3100),
  ];
}
function renderSB(s) {
  const rs = ROUNDS.slice(s.from, s.to), cell = (txt, pt) => `<span class="fl ${pt==null?"":pt?"L":"D"}">${txt}</span>`;
  s.el.querySelector(".rows").innerHTML = `<div class="r hd"><span>Startup</span><span>Raised</span><span>Survived</span><span>Today</span><span style="text-align:right">Pts</span></div>` +
    rs.map(R => { const mp = moneyPt(R), ep = endPt(R);
      return `<div class="r">${chip(R)}${cell(S.money[R.id]==null?"—":MONEY[S.money[R.id]], mp)}${cell(S.end[R.id]?FATE[S.end[R.id]]:"—", ep)}<span class="g">${R.today}</span><span class="pp">${mp==null&&ep==null?"—":roundPts(R)}</span></div>`; }).join("");
  const pts = rs.reduce((t,R)=>t+roundPts(R),0), tot = ROUNDS.slice(0, s.to).reduce((t,R)=>t+roundPts(R),0);
  s.el.querySelector(".tot").innerHTML = `<div class="k px">${s.to===ROUNDS.length?"Part 2":"Part 1"}</div><div class="v">${pts}<small>/${rs.length*2}</small></div>
    <div class="d">Total: ${tot} / ${MAXPTS}<br>Rank: ${rankOf(tot)}</div>`;
}
function renderYard(s) {
  const tile = (R,k) => { const p = endPt(R), mk = p==null ? "" : `<div class="mk" style="background:${p?"var(--live)":"var(--dead)"}">${p?"✓":"✗"}</div>`;
    return `<div class="tile ${R.fate==="L"?"w":""}" style="animation-delay:${k*.12}s"><b>${R.name}</b><span class="px">${R.raised}</span>${mk}</div>`; };
  s.el.querySelector("#yd").innerHTML = ROUNDS.filter(R=>R.fate==="D").map(tile).join("");
  s.el.querySelector("#yl").innerHTML = ROUNDS.filter(R=>R.fate==="L").map(tile).join("");
}
function renderFinal(s) {
  const tot = ROUNDS.reduce((t,R)=>t+roundPts(R),0), r = rankOf(tot);
  s.el.querySelector(".fin-v").innerHTML = `${tot}<small>/${MAXPTS}</small>`;
  s.el.querySelector(".fin-rank").textContent = r;
  s.el.querySelector(".ladder").innerHTML = RANKS.map(([n,t])=>`<div class="px ${n===r?"me":""}"><span>${n}</span><span>${Math.ceil(t*MAXPTS)}+</span></div>`).join("");
  const REID = 16, msg = tot > REID ? "You beat Reid. Tell him in the comments." : tot === REID ? "You tied Reid. Tell him in the comments." : "Reid wins this one.";
  s.el.querySelector(".vs").innerHTML = `<div class="k px">Reid got</div><div class="v">${REID} / ${MAXPTS} · VP</div><div class="d">${msg}</div>`;
}

// ---- navigation
function show(n) {
  cur = Math.max(0, Math.min(screens.length-1, n));
  screens.forEach((s,i)=>s.el.classList.toggle("on", i===cur));
  const s = screens[cur];
  log("screen", { n:cur, kind:s.kind, round:s.R?.id });
  if (s.kind==="money" || s.kind==="end") renderQ(s);
  if (s.kind==="sb") renderSB(s);
  if (s.kind==="yard") renderYard(s);
  if (s.kind==="final") renderFinal(s);
  hud(s, s.kind==="reveal");
  if (s.kind==="reveal") renderReveal(s);
}
function next() {
  const s = screens[cur];
  const open = (s.kind==="money" && S.money[s.R.id] == null) || (s.kind==="end" && S.end[s.R.id] == null);
  if (open) { const b = s.el.querySelector(".btns"); b.classList.remove("nudge"); void b.offsetWidth; b.classList.add("nudge"); return; }
  show(cur+1);
}

stage.insertAdjacentHTML("beforeend", `<div id="cheatlay"><div class="panel">${CHEAT}</div></div>`);
const cheatlay = document.getElementById("cheatlay");
function toggleCheat(on = !cheatlay.classList.contains("on")) { cheatlay.classList.toggle("on", on); log("cheat", { n:cur, open:on }); }

document.addEventListener("keydown", e => {
  document.getElementById("help").style.display = "none";
  const k = e.key.toLowerCase();
  if (k==="h") return toggleCheat();
  if (cheatlay.classList.contains("on")) { if (e.key==="Escape" || e.key===" " || e.key==="Enter" || e.key==="ArrowRight") { e.preventDefault(); toggleCheat(false); } return; }
  const s = screens[cur];
  if (k==="a" || k==="d") return answer(s, k==="a");
  if (e.key==="ArrowRight" || e.key===" " || e.key==="Enter") { e.preventDefault(); next(); }
  if (e.key==="ArrowLeft") show(cur-1);
  if (k==="f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (k==="r") { S = { money:{}, end:{} }; save(); log("reset"); show(0); }
});
stage.addEventListener("click", e => {
  if (cheatlay.classList.contains("on")) return toggleCheat(false);
  if (e.target.closest("[data-cheat]")) return toggleCheat(true);
  const s = screens[cur], pk = e.target.closest(".pk");
  if (pk) return answer(s, pk.dataset.p==="1");
  next();
});

function fit() { const k = Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform = `translate(-50%,-50%) scale(${k})`; }
// show.html#12 jumps straight to screen 12 (to pick back up mid-take)
addEventListener("resize", fit); fit(); show(parseInt(location.hash.slice(1)) || 0);
</script>
